services:
  mysql:
    image: mysql:9.7
    container_name: mysql9-db-read-through-cache
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: read-through-cache
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: