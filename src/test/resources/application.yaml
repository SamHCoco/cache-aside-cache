spring:
  application:
    name: cache-aside-cache
  output:
    ansi:
      enabled: ALWAYS
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:h2:mem:cache-aside-cache
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 9000